# Toolchain for the whole project. `mise install` is the only setup step.
# The JDK is pinned to Java 21: Java 25 is the newer LTS but the Android Gradle
# Plugin does not support it yet.

[tools]
java = "temurin-21.0.12"
gradle = "9.7.0"
# Android command line tools, which provide sdkmanager.
"android-sdk" = "22.0"

[hooks]
# Fills ANDROID_HOME, so `mise install` is the whole setup. This runs on every
# `mise install`, including when the tools above are already there — a
# tool-level postinstall would be skipped and leave ANDROID_HOME empty.
postinstall = "mise run install-sdk"

[env]
# The SDK sits in the user's data dir, not in the repo: one copy is shared by
# every worktree, so a new worktree needs no download and removing one leaves
# the SDK alone. Still nothing system-wide — `rm -rf` on the path undoes it.
ANDROID_HOME = "{{xdg_data_home}}/countdown/android-sdk"
ANDROID_SDK_ROOT = "{{xdg_data_home}}/countdown/android-sdk"
# Ahead of the mise install dir, so sdkmanager and avdmanager resolve the shared
# SDK rather than an empty one next to themselves.
_.path = [
  "{{xdg_data_home}}/countdown/android-sdk/cmdline-tools/latest/bin",
  "{{xdg_data_home}}/countdown/android-sdk/platform-tools",
]

[tasks.install-sdk]
description = "Install the Android SDK packages into ANDROID_HOME"
run = """
set -e
# The tools resolve the SDK from their own location, not from ANDROID_HOME, so
# they have to live inside it or they read an empty SDK and say nothing useful.
mkdir -p "$ANDROID_HOME/cmdline-tools"
rm -rf "$ANDROID_HOME/cmdline-tools/latest"
# Named off the mise install rather than PATH, which by now points at the copy.
cp -r "$(find "$(mise where android-sdk)/cmdline-tools" -mindepth 1 -maxdepth 1 -type d)" \
  "$ANDROID_HOME/cmdline-tools/latest"

sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
yes | "$sdkmanager" --licenses > /dev/null
# platform-tools has no versioned package path, so adb is whatever is current.
"$sdkmanager" \
  "platform-tools" \
  "build-tools;37.0.0" \
  "platforms;android-37.1"
"""

[tasks.keystore]
description = "Generate the release keystore outside the repo and keep its password in pass"
run = "./tools/make-keystore.sh"

[tasks.build]
description = "Build the signed release APK"
run = "gradle :app:assembleRelease"

[tasks.test]
description = "Run the JVM unit tests"
run = "gradle :app:testDebugUnitTest"

[tasks.install]
description = "Install the release APK on the connected device and launch it"
depends = ["build"]
run = """
set -e
adb install -r app/build/outputs/apk/release/app-release.apk
adb shell am start -n ninja.notnot.countdown/.MainActivity
"""
